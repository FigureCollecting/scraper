# buf module config for the engine's own gRPC contracts (fc.diag.v1).
# The proto lives here, not in fc-shared, because its only client is the
# scraper's own CLI in the same image (hands-off plan HD-9 (a), pending Ross).
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
# No `breaking:` section and no `buf breaking` step: the server and its only client (the diag CLI)
# ship in the same image, and the diag CronJobs run the scraper's own image digest (plan unit I1),
# so no two versions talk. Field names and numbers are pinned by src/__tests__/unit/diagProto.test.ts.
