# Grype vulnerability scanner configuration
# https://github.com/anchore/grype#specifying-matches-to-ignore

ignore:
  # GHSA-5j98-mcp5-4vw2: glob CLI command injection
  # This vulnerability only affects the glob CLI (-c/--cmd option), not the library API.
  # TypeScript declares "glob": "^10.4.5" as a dependency but never actually installs it
  # because it's optional. The glob package is not present in typescript/node_modules.
  # npm ls typescript shows no glob dependency in the tree.
  # This is a grype false positive - flagging a declared but uninstalled dependency.
  - vulnerability: GHSA-5j98-mcp5-4vw2
    package:
      name: glob
      type: npm
    reason: |
      False positive: TypeScript declares glob as a dependency but doesn't install it.
      The vulnerability is CLI-only and glob CLI is not used in this application.
      Verified: no glob binary in node_modules, npm ls shows no glob for typescript.

  # minimatch 10.2.x ReDoS vulnerabilities (GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74)
  # minimatch 10.x is a transitive dependency of puppeteer-extra-plugin-stealth via rimraf/glob.
  # The lockfile pins minimatch to 10.2.4 (>= 10.2.3 fix version).
  # If grype still detects 10.2.2, it is from the globally installed npm CLI (npm install -g npm@latest),
  # not from application code. npm's minimatch is only used during package installation, not at runtime.
  # The application does not process untrusted glob patterns through minimatch.
  - vulnerability: GHSA-7r86-cg39-jmmj
    package:
      name: minimatch
      type: npm
    reason: |
      Lockfile pins minimatch to 10.2.4 (fixed). Any 10.2.2 finding is from npm CLI internals,
      not application code. No untrusted glob patterns are processed at runtime.
  - vulnerability: GHSA-23c5-xmqv-rm74
    package:
      name: minimatch
      type: npm
    reason: |
      Lockfile pins minimatch to 10.2.4 (fixed). Any 10.2.2 finding is from npm CLI internals,
      not application code. No untrusted glob patterns are processed at runtime.

  # GO-2026-5026: golang.org/x/net v0.40.0 (fixed 0.55.0), vendored INSIDE the esbuild Go binary.
  # esbuild is a BUILD-ONLY dependency: it is pulled in transitively by tsx (devDependencies),
  # which is used only for the local `dev` hot-reload script. `npm run build` uses tsc, not esbuild.
  # The production image installs with `npm ci --omit=dev`, so esbuild is NOT in the shipped runtime.
  # Verified 2026-07-31: `find /` and `grype` on the built production image (ghcr.io/figurecollecting/
  # scraper) show no esbuild and no golang.org/x/net; prod node_modules is 365 pkgs (vs 822 with dev).
  # The finding surfaces only because the scanner catalogs the multi-stage build's BUILDER layer, where
  # the full devDependency install briefly exists so `tsc` can run. The vendored x/net (idna/http2/hpack)
  # is internal to esbuild's own operation and never processes this service's untrusted network input.
  # No upgrade escapes it: esbuild 0.28.1 is the latest release (and tsx's pinned range) and still
  # vendors x/net v0.40.0. Revisit when esbuild ships a build vendoring x/net >= 0.55.0.
  - vulnerability: GO-2026-5026
    package:
      name: golang.org/x/net
      type: go-module
    reason: |
      Dev/build-only: esbuild (via tsx, devDependencies) is pruned from the production image by
      `npm ci --omit=dev` and is absent from the shipped runtime (verified via filesystem + grype scan
      of the built image). The vendored x/net is internal to esbuild and never in the runtime attack
      surface. esbuild 0.28.1 is the latest release and still vendors x/net v0.40.0, so no bump removes it.

  # 2026-08-08: brace-expansion / ip-address flagged by grype come from the Node runtime's
  # BUNDLED npm (/usr/local/lib/node_modules/npm/...), NOT this app's dependencies. Our app
  # deps are fixed (brace-expansion 5.0.9, ip-address 10.4.0) and pass NPM Audit + Trivy +
  # the Dependency Vulnerability Scan. The npm CLI copies run only during image build, never
  # in the running app's attack surface — same class as the minimatch entries above.
  - vulnerability: GHSA-rgw5-rvv9-x895
    package:
      name: brace-expansion
      type: npm
    reason: |
      Node's bundled-npm internal (not an app dep). App brace-expansion is 5.0.9 (fixed) and
      passes the npm-level scans. Not runtime-reachable.
  - vulnerability: GHSA-mh99-v99m-4gvg
    package:
      name: brace-expansion
      type: npm
    reason: |
      Node's bundled-npm internal; app dep fixed at 5.0.9. Not runtime-reachable.
  - vulnerability: GHSA-mwp4-54f8-5fhr
    package:
      name: ip-address
      type: npm
    reason: |
      Node's bundled-npm internal (via npm's socks-proxy-agent chain); app dep fixed at 10.4.0.
      Not runtime-reachable.

  # 2026-08-08: Chrome binary CVEs. This is a HEADLESS, programmatically-driven scraper that
  # navigates controlled target URLs via Puppeteer and NEVER renders untrusted pages to an
  # interactive user, so the renderer-exploit chain (RCE via a malicious page a user visits)
  # is outside our threat model. Puppeteer's Chrome-for-Testing build also structurally lags
  # Chrome-stable's security releases, so version-pinning can never keep grype green. Chrome is
  # pinned to the newest CfT build for hygiene; residual binary CVEs are accepted by policy.
  # REVIEW: 2026-11 or on a puppeteer major upgrade.
  - package:
      name: chrome
      type: binary
    reason: |
      Headless controlled scraper; no untrusted-page rendering to a user. CfT Chrome lags
      Chrome-stable so version-chasing cannot keep the gate green. Residual binary CVEs
      accepted by policy. Review 2026-11.
