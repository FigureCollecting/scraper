name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# CI policy ("fork shift-left"): publishing is org-only. On a fork
# (repository_owner != FigureCollecting) this job is skipped, so a fork can
# never publish into the FigureCollecting scope. Upstream behaviour unchanged.

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'FigureCollecting'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
