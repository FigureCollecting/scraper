name: Security Vulnerability Scan

on:
  push:
    branches: ['**', '!dependabot/**']  # every branch except Dependabot's; the job-level gate below decides what runs
  pull_request:
    branches: [develop, main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# ---------------------------------------------------------------------------
# CI policy: "fork shift-left" (see README, "CI on forks (shift-left)").
# Developers work on forks and open PRs to FigureCollecting/*. Every push
# event is gated per entry job by ONE expression (pull_request, schedule and
# workflow_dispatch behave exactly as before). The four push cases:
#   owner == FigureCollecting, ref develop|main -> RUN  (upstream integration branches, unchanged)
#   owner == FigureCollecting, any other ref    -> SKIP (upstream feature branches get CI via their PR)
#   owner != FigureCollecting, ref develop|main -> SKIP (fork develop/main are mirrors of upstream: run nothing)
#   owner != FigureCollecting, any other ref    -> RUN  (shift-left: CI on fork feature branches)
# Jobs that `needs:` a gated entry job skip cleanly (never fail) when it skips.
# Dependabot branches (dependabot/**) are excluded from the push trigger: they
# live on upstream and get their CI from the pull_request run; a push twin would
# only add a same-named `skipped` check run beside the real one.
# Note: expression `==` is case-insensitive (GitHub has no case-sensitive
# compare), so a branch named e.g. `Develop` counts as a mirror; nothing here
# publishes, so at worst a CI run is skipped or runs on an oddly named branch.
# Install/build steps authenticate with secrets.NODE_AUTH_TOKEN (fork-held PAT,
# read:packages only) and fall back to GITHUB_TOKEN on the org; publishing
# (GHCR push, npm publish, releases) is org-only.
# ---------------------------------------------------------------------------

jobs:
  # Scan dependencies for vulnerabilities
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    # Push gate: the single CI-policy expression (four cases documented above).
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner (repo mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'dependency-scan'

      - name: Run Trivy for PR comment
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  # Scan Docker images for vulnerabilities
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    # Push gate: the single CI-policy expression (four cases documented above).
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: scraper:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'scraper:scan'
          format: 'sarif'
          output: 'container-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'container-results.sarif'
          category: 'container-scan'

  # Run npm audit for additional coverage
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    # Push gate: the single CI-policy expression (four cases documented above).
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate --omit=dev
          echo "## NPM Audit Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --omit=dev 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Check for critical vulnerabilities
        run: |
          # Use || true because npm audit returns exit code 1 for ANY vulnerability
          audit_output=$(npm audit --json --omit=dev 2>/dev/null || true)
          critical_count=$(echo "$audit_output" | jq '.metadata.vulnerabilities.critical // 0')
          high_count=$(echo "$audit_output" | jq '.metadata.vulnerabilities.high // 0')

          if [ "$critical_count" -gt 0 ]; then
            echo "❌ Found $critical_count critical vulnerabilities"
            exit 1
          elif [ "$high_count" -gt 0 ]; then
            echo "⚠️ Found $high_count high vulnerabilities"
            # Don't fail on high, just warn
          else
            echo "✅ No critical or high vulnerabilities found"
          fi